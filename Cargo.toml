[workspace]
resolver = "2"
members = ["src-tauri", "crates/dbx-core", "crates/dbx-web"]
exclude = ["vendor/ctor", "vendor/dirs-sys", "vendor/pageant", "vendor/wry"]

[patch.crates-io]
# Tauri 2.11 uses ctor 0.8, which excludes Rust's win7 vendor. This vendors
# upstream rust-ctor#443 until tauri-utils moves to ctor 1.x.
ctor = { path = "vendor/ctor" }
# Keep two small upstream crates on Win7-compatible API calls. Their current
# Windows bindings otherwise import COMBASE or WinRT APIs unavailable on Win7.
dirs-sys = { path = "vendor/dirs-sys" }
pageant = { path = "vendor/pageant" }
# Wry 0.55 probes and creates WebView2 with a null browser folder. Pass the
# bundled Fixed Runtime path explicitly so Windows 7 does not fall back to an
# unavailable system Runtime.
wry = { path = "vendor/wry" }
# OG Developer: vendored gaussdb fork with NOTICE forwarding (RAISE NOTICE capture
# for the native wire driver). See vendor/tokio-postgres-gaussdb/.
tokio-postgres = { path = "vendor/tokio-postgres-gaussdb/tokio-postgres" }
postgres-types = { path = "vendor/tokio-postgres-gaussdb/postgres-types" }
postgres-protocol = { path = "vendor/tokio-postgres-gaussdb/postgres-protocol" }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
